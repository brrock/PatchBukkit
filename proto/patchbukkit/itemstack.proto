syntax = "proto3";

package patchbukkit.itemstack;

import "patchbukkit/common/types.proto";

option java_multiple_files = true;
option java_package = "patchbukkit.itemstack";
option java_outer_classname = "ItemStackProto";

// message GetPatchBukkitConfigResponse {
//   string minimum_supported_plugin_api = 1;
// }

message ItemStack {
  string type = 1;
  uint32 amount = 2;
  // Enchantment key (e.g. "minecraft:unbreaking") -> level.
  map<string, int32> enchantments = 3;
  // Display name and lore lines as legacy (section sign) formatted text.
  optional string custom_name = 4;
  repeated string lore = 5;
  int32 damage = 6;
  bool unbreakable = 7;
  // Leather armor colour as 0xRRGGBB.
  optional int32 dyed_color = 8;
}

message GetPlayerInventoryResponse {
  repeated ItemStack main_inventory = 1;
  uint32 selected_slot = 2;
  ItemStack off_hand = 3;
  ItemStack helmet = 4;
  ItemStack chestplate = 5;
  ItemStack leggings = 6;
  ItemStack boots = 7;
}

message SetPlayerInventorySlotRequest {
  patchbukkit.common.UUID uuid = 1;
  uint32 slot = 2;
  ItemStack item = 3;
}

message SetPlayerSelectedSlotRequest {
  patchbukkit.common.UUID uuid = 1;
  uint32 slot = 2;
}

message SetPlayerEquipmentRequest {
  patchbukkit.common.UUID uuid = 1;
  uint32 slot_type = 2;
  ItemStack item = 3;
}


message EnderChestContents {
  repeated ItemStack items = 1;
}

// A plugin-created inventory (Bukkit createInventory) shown through Pumpkin.
message CustomInventoryRequest {
  uint64 id = 1;
  // Open only: the viewer, the row count (1-6) and the title (legacy text).
  patchbukkit.common.UUID viewer = 2;
  uint32 rows = 3;
  string title = 4;
  // Open: the initial contents. Set: the contents to store.
  repeated ItemStack items = 5;
}

message CustomInventoryResponse {
  // False once Pumpkin no longer holds this inventory (every viewer closed it).
  bool found = 1;
  repeated ItemStack items = 2;
}

syntax = "proto3";

package patchbukkit.registry;

import "patchbukkit/common/types.proto";

option java_multiple_files = true;
option java_package = "patchbukkit.registry";

enum RegistryType {
  SOUND_EVENT = 0;
}

message GetRegistryDataRequest {
  RegistryType registry = 1;
}

message GetRegistryDataResponse {
  oneof registry {
    SoundEventRegistryData sound_event = 1;
  }
}

message SoundEvent {
  uint32 id = 1;
  string name = 2;
}

message SoundEventRegistryData {
  repeated SoundEvent sound_events = 1;
}

message GetTagsRequest {
  // Vanilla registry name, e.g. "block", "item", "entity_type", "worldgen/biome".
  string registry = 1;
  // Namespaced tag key; empty to list every tag of the registry.
  string tag = 2;
}

message TagEntry {
  string key = 1;
  // Namespaced keys of the tagged entries, nested tags already resolved.
  repeated string values = 2;
}

message GetTagsResponse {
  repeated TagEntry tags = 1;
}

syntax = "proto3";

package patchbukkit.registry;

import "patchbukkit/common/types.proto";

option java_multiple_files = true;
option java_package = "patchbukkit.registry";

enum RegistryType {
  SOUND_EVENT = 0;
}

message GetRegistryDataRequest {
  RegistryType registry = 1;
}

message GetRegistryDataResponse {
  oneof registry {
    SoundEventRegistryData sound_event = 1;
  }
}

message SoundEvent {
  uint32 id = 1;
  string name = 2;
}

message SoundEventRegistryData {
  repeated SoundEvent sound_events = 1;
}

message GetItemTypeDataRequest {
  // Namespaced item key, e.g. "minecraft:diamond_sword".
  string key = 1;
}

message ItemTypeData {
  bool found = 1;
  int32 max_stack_size = 2;
  int32 max_durability = 3;
  bool edible = 4;
  bool record = 5;
  bool fuel = 6;
  float compost_chance = 7;
  string translation_key = 8;
}

message GetBlockTypeDataRequest {
  // Namespaced block key, e.g. "minecraft:stone".
  string key = 1;
}

message BlockTypeData {
  bool found = 1;
  float hardness = 2;
  float blast_resistance = 3;
  float slipperiness = 4;
  bool air = 5;
  bool solid = 6;
  bool flammable = 7;
  bool burnable = 8;
  bool occluding = 9;
  bool has_collision = 10;
  bool has_item = 11;
  string translation_key = 12;
}
